name: canary-deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
  deployments: write
jobs:
  deploy:
    if: contains(github.event.head_commit.message, 'canary') && !contains(github.event.head_commit.message, 'stall=deploy')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api -X POST repos/$GITHUB_REPOSITORY/deployments -f ref=$GITHUB_SHA -f environment=live -F auto_merge=false -F 'required_contexts[]' -f description="canary deploy marker" -q .id)
          gh api -X POST repos/$GITHUB_REPOSITORY/deployments/$id/statuses -f state=success -f description="live marker for $GITHUB_SHA"